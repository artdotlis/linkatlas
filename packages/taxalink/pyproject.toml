[project]
name = "taxalink"
version = "0.1.0"
description = """Search and link type strains in taxonomy."""
readme = "README.md"
authors = [{ name = "Artur Lissin", email = "artdotlis@pm.me" }]
requires-python = ">=3.13"
dependencies = [
  # local
  # central dependencies
  "utilslink",
  # other local
]

[project.scripts]
typ_update = "taxalink.update:run"
typ_report = "taxalink.report:run"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"


[tool.uv.sources]
utilslink = { workspace = true }

[tool.uv]
package = true
default-groups = []
