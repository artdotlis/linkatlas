[project]
name = "utilslink"
version = "0.1.0"
description = "Utility library for linkatlas."
readme = "README.md"
authors = [{ name = "artdotlis", email = "artdotlis@pm.me" }]
requires-python = ">=3.13"
dependencies = [
    "urllib3 ==2.6.3",
    "pydantic ==2.12.5",
    "requests ==2.32.5",
    "requests-cache ==1.2.1",
    "saim @ git+https://github.com/LeibnizDSMZ/saim.git@v0.9.30",
    "mPyFlow @ git+https://github.com/artdotlis/mPyFlow.git#master",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = []
