[project]
name = "catlink"
version = "0.1.0"
description = """Search and link strains on catalog websites."""
readme = "README.md"
authors = [{ name = "Artur Lissin", email = "artdotlis@pm.me" }]
requires-python = ">=3.13"
dependencies = [
  # local
  # central dependencies
  "utilslink",
  # other local
  "taxalink",
  "publink",
  "seqlink",
]

[project.scripts]
pub_update = "catlink.update:run"
pub_report = "catlink.report:run"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
utilslink = { workspace = true }
taxalink = { workspace = true }

[tool.uv]
package = true
default-groups = []
